name: Deploy Monitoring

on:
  push:
    branches:
      - main
    paths:
      - "monitor_health.py"
      - "README.md"
      - "tests/**"
      - "requirements-dev.txt"
      - "monitor_targets.example.json"
      - "deploy/uptime-monitor.service"
      - "deploy/uptime-monitor.timer"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-monitoring-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test monitoring notifications
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m py_compile monitor_health.py
          python3 -m pytest -q

      - name: Back up current monitor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            backup_dir="/opt/uptime-monitor/backups/${{ github.sha }}"
            install -d -m 0700 "$backup_dir"
            cp -p /opt/uptime-monitor/monitor_health.py "$backup_dir/monitor_health.py"
            if test -f /var/lib/uptime-monitor/state.json; then
              cp -p /var/lib/uptime-monitor/state.json "$backup_dir/state.json"
              chmod 0600 "$backup_dir/state.json"
            fi

      - name: Upload monitoring files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "monitor_health.py,README.md,monitor_targets.example.json,deploy/uptime-monitor.service,deploy/uptime-monitor.timer"
          target: /opt/uptime-monitor

      - name: Restart monitor on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/uptime-monitor

            chown root:root monitor_health.py README.md monitor_targets.example.json
            chown -R root:root deploy
            chmod 0644 monitor_health.py README.md monitor_targets.example.json deploy/*.service deploy/*.timer
            python3 -m py_compile monitor_health.py
            install -m 0644 deploy/uptime-monitor.service /etc/systemd/system/uptime-monitor.service
            install -m 0644 deploy/uptime-monitor.timer /etc/systemd/system/uptime-monitor.timer
            systemctl daemon-reload

            python3 - <<'PY'
            import json
            from pathlib import Path

            path = Path('/opt/uptime-monitor/monitor_targets.json')
            if path.exists():
                data = json.loads(path.read_text(encoding='utf-8'))
                changed = False
                for item in data:
                    target_id = str(item.get('id', ''))
                    if target_id.startswith('bot-tan-') and item.get('affects_exit_code') is not False:
                        item['affects_exit_code'] = False
                        changed = True
                if changed:
                    path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
            PY

            test -x /opt/uptime-monitor/venv/bin/python
            test -f /opt/uptime-monitor/.env.monitor
            test -f /opt/uptime-monitor/monitor_targets.json

            systemctl enable --now uptime-monitor.timer
            if ! systemctl restart uptime-monitor.service; then
              journalctl -u uptime-monitor.service -n 100 --no-pager
              exit 1
            fi

            systemctl show uptime-monitor.service -p Result -p ExecMainStatus -p ActiveState -p SubState
            systemctl show uptime-monitor.service --value -p Result | grep -Fx 'success'
            systemctl is-enabled --quiet uptime-monitor.timer
            systemctl is-active --quiet uptime-monitor.timer
            systemctl list-timers uptime-monitor.timer --no-pager
            echo "Monitoring enabled and checked at $(date)"
